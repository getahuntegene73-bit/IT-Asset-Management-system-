<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employees | IT Asset Management</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f4f6;
            color: #111827;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100vh;
            background: #111827;
            color: white;
            padding: 20px 15px;
        }

        .company-logo {
            text-align: center;
            margin-bottom: 15px;
        }

        .company-logo img {
            width: 170px;
            height: 70px;
            object-fit: contain;
            background: white;
            border-radius: 6px;
        }

        .system-title {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .menu-title {
            color: #9ca3af;
            font-size: 12px;
            margin: 20px 10px 10px;
            text-transform: uppercase;
        }

        .sidebar a {
            display: block;
            color: #d1d5db;
            text-decoration: none;
            padding: 12px 14px;
            margin-bottom: 5px;
            border-radius: 7px;
            font-size: 14px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #2563eb;
            color: white;
        }

        .main {
            margin-left: 250px;
            padding: 25px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .topbar h1 {
            font-size: 28px;
        }

        .topbar p {
            color: #6b7280;
            margin-top: 5px;
        }

        .btn {
            border: none;
            padding: 11px 18px;
            border-radius: 7px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .filter-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-box input,
        .filter-box select {
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            min-width: 220px;
        }

        .table-container {
            background: white;
            border-radius: 10px;
            overflow-x: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 950px;
        }

        th {
            background: #f9fafb;
            text-align: left;
            padding: 15px;
            font-size: 13px;
            color: #374151;
            border-bottom: 1px solid #e5e7eb;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
        }

        tr:hover {
            background: #f9fafb;
        }

        .status {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .active-status {
            background: #dcfce7;
            color: #166534;
        }

        .inactive-status {
            background: #fee2e2;
            color: #991b1b;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        @media (max-width: 800px) {

            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
            }

            .main {
                margin-left: 0;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .filter-box {
                flex-direction: column;
            }

            .filter-box input,
            .filter-box select {
                width: 100%;
            }
        }
    </style>
</head>

<body>


<div class="sidebar">

    <div class="company-logo">
        <img src="assets/logo.jpg" alt="Elsewedy Cables Logo">
    </div>

    <div class="system-title">
        IT Asset Manager
    </div>

    <div class="menu-title">Main Menu</div>

    <a href="index.html">📊 Dashboard</a>
    <a href="assets.html">💻 Assets</a>
    <a href="employees.html" class="active">👥 Employees</a>
    <a href="#">🔄 Assignments</a>
    <a href="#">🔧 Maintenance</a>
    <a href="#">📈 Reports</a>

    <div class="menu-title">System</div>

    <a href="#">⚙️ Settings</a>

</div>


<div class="main">

    <div class="topbar">

        <div>
            <h1>Employees</h1>
            <p>Manage employees and their IT asset information.</p>
        </div>

        <a href="add-employee.html" class="btn btn-primary">
            + Add Employee
        </a>

    </div>


    <div class="filter-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search employee..."
            onkeyup="filterEmployees()"
        >

        <select
            id="departmentFilter"
            onchange="filterEmployees()"
        >
            <option value="">All Departments</option>
            <option value="IT">IT</option>
            <option value="Finance">Finance</option>
            <option value="HR">HR</option>
            <option value="Production">Production</option>
            <option value="Purchasing">Purchasing</option>
            <option value="Quality">Quality</option>
            <option value="Management">Management</option>
        </select>

        <select
            id="statusFilter"
            onchange="filterEmployees()"
        >
            <option value="">All Status</option>
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
        </select>

    </div>


    <div class="table-container">

        <table>

            <thead>

                <tr>
                    <th>Employee ID</th>
                    <th>Full Name</th>
                    <th>Department</th>
                    <th>Position</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Status</th>
                </tr>

            </thead>

            <tbody id="employeeTable"></tbody>

        </table>

    </div>

</div>


<script>

const sampleEmployees = [

    {
        id: "EMP-001",
        name: "Abebe Kebede",
        department: "IT",
        position: "IT Manager",
        phone: "0911000000",
        email: "abebe@example.com",
        status: "Active"
    },

    {
        id: "EMP-002",
        name: "Hanna Tesfaye",
        department: "Finance",
        position: "Accountant",
        phone: "0922000000",
        email: "hanna@example.com",
        status: "Active"
    },

    {
        id: "EMP-003",
        name: "Dawit Girma",
        department: "Production",
        position: "Production Supervisor",
        phone: "0933000000",
        email: "dawit@example.com",
        status: "Active"
    },

    {
        id: "EMP-004",
        name: "Meron Alemu",
        department: "HR",
        position: "HR Officer",
        phone: "0944000000",
        email: "meron@example.com",
        status: "Inactive"
    }

];


let savedEmployees =
    JSON.parse(localStorage.getItem("employees")) || [];

let employees =
    [...sampleEmployees, ...savedEmployees];


function displayEmployees(data) {

    const table =
        document.getElementById("employeeTable");

    table.innerHTML = "";


    if (data.length === 0) {

        table.innerHTML = `
            <tr>
                <td colspan="7" class="empty">
                    No employees found.
                </td>
            </tr>
        `;

        return;
    }


    data.forEach(employee => {

        const statusClass =
            employee.status === "Active"
            ? "active-status"
            : "inactive-status";


        table.innerHTML += `

            <tr>

                <td>
                    <strong>${employee.id}</strong>
                </td>

                <td>
                    ${employee.name}
                </td>

                <td>
                    ${employee.department}
                </td>

                <td>
                    ${employee.position}
                </td>

                <td>
                    ${employee.phone}
                </td>

                <td>
                    ${employee.email}
                </td>

                <td>
                    <span class="status ${statusClass}">
                        ${employee.status}
                    </span>
                </td>

            </tr>

        `;

    });

}


function filterEmployees() {

    const search =
        document.getElementById("searchInput")
        .value
        .toLowerCase();

    const department =
        document.getElementById("departmentFilter")
        .value;

    const status =
        document.getElementById("statusFilter")
        .value;


    const filtered =
        employees.filter(employee => {

            const matchesSearch =
                employee.id.toLowerCase().includes(search) ||
                employee.name.toLowerCase().includes(search) ||
                employee.position.toLowerCase().includes(search) ||
                employee.email.toLowerCase().includes(search);


            const matchesDepartment =
                department === "" ||
                employee.department === department;


            const matchesStatus =
                status === "" ||
                employee.status === status;


            return (
                matchesSearch &&
                matchesDepartment &&
                matchesStatus
            );

        });


    displayEmployees(filtered);

}


displayEmployees(employees);

</script>

</body>
</html>
