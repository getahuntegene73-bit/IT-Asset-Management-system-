<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | IT Asset Management</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f4f6;
            color: #111827;
        }

        /* SIDEBAR */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100vh;
            background: #111827;
            color: white;
            padding: 18px 15px;
            overflow-y: auto;
        }

        /* LOGO */
        .company-logo {
            width: 100%;
            padding: 10px 5px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .company-logo img {
            width: 190px;
            height: auto;
            max-height: 105px;
            object-fit: contain;
            display: block;
            background: white;
            padding: 7px;
            border-radius: 8px;
        }

        /* SYSTEM TITLE */
        .system-title {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 22px;
        }

        /* USER ROLE */
        .user-role {
            text-align: center;
            background: #1f2937;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 20px;
        }

        .user-role-name {
            font-size: 14px;
            font-weight: bold;
        }

        .user-role-type {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 4px;
        }

        /* MENU */
        .menu-title {
            color: #9ca3af;
            font-size: 11px;
            margin: 18px 10px 9px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .sidebar a {
            display: block;
            color: #d1d5db;
            text-decoration: none;
            padding: 11px 13px;
            margin-bottom: 4px;
            border-radius: 7px;
            font-size: 14px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #2563eb;
            color: white;
        }

        /* LOGOUT */
        .logout-btn {
            width: 100%;
            margin-top: 25px;
            padding: 11px;
            border: 1px solid #374151;
            border-radius: 7px;
            background: transparent;
            color: #d1d5db;
            cursor: pointer;
            font-size: 13px;
        }

        .logout-btn:hover {
            background: #dc2626;
            border-color: #dc2626;
            color: white;
        }
