<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | IT Asset Manager</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 400px;
            background: #ffffff;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        .logo-area {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-area img {
            width: 210px;
            height: auto;
            max-height: 115px;
            object-fit: contain;
        }

        .title {
            text-align: center;
            margin-bottom: 25px;
        }

        .title h1 {
            font-size: 24px;
            color: #111827;
            margin-bottom: 6px;
        }

        .title p {
            color: #6b7280;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #374151;
            font-size: 14px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #2563eb;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: #9ca3af;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .login-container {
                width: 90%;
                padding: 25px;
            }

            .logo-area img {
                width: 180px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo-area">
            <img src="assets/logo.jpg" alt="Elsewedy Cables Logo">
        </div>

        <div class="title">
            <h1>IT Asset Manager</h1>
            <p>Sign in to continue</p>
        </div>

        <form id="loginForm">

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="role">Login As</label>

                <select id="role" required>
                    <option value="">Select role</option>
                    <option value="admin">Administrator</option>
                    <option value="user">Normal User</option>
                </select>
            </div>

            <button type="submit" class="login-btn">
                Sign In
            </button>

            <div id="message" class="message"></div>

        </form>

        <div class="footer">
            IT Asset Management System © 2026
        </div>

    </div>

    <script>

        document.getElementById("loginForm").addEventListener("submit", function(event) {

            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const role = document.getElementById("role").value;

            const message = document.getElementById("message");

            /*
             * DEMO LOGIN
             * This is only for the frontend prototype.
             */

            if (role === "admin" &&
                username === "admin" &&
                password === "admin123") {

                localStorage.setItem("userRole", "admin");
                localStorage.setItem("username", username);

                window.location.href = "index.html";

            } else if (role === "user" &&
                       username === "user" &&
                       password === "user123") {

                localStorage.setItem("userRole", "user");
                localStorage.setItem("username", username);

                window.location.href = "index.html";

            } else {

                message.style.display = "block";
                message.style.color = "#dc2626";
                message.textContent =
                    "Invalid username, password, or role.";

            }

        });

    </script>

</body>
</html>
