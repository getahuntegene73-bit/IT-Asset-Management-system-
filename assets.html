<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assets | IT Asset Management</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f4f6;
            color: #111827;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100vh;
            background: #111827;
            color: white;
            padding: 20px 15px;
        }

        .company-logo {
            text-align: center;
            margin-bottom: 15px;
        }

        .company-logo img {
            width: 170px;
            height: 70px;
            object-fit: contain;
            background: white;
            border-radius: 6px;
        }

        .system-title {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .menu-title {
            color: #9ca3af;
            font-size: 12px;
            margin: 20px 10px 10px;
            text-transform: uppercase;
        }

        .sidebar a {
            display: block;
            color: #d1d5db;
            text-decoration: none;
            padding: 12px 14px;
            margin-bottom: 5px;
            border-radius: 7px;
            font-size: 14px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #2563eb;
            color: white;
        }

        .main {
            margin-left: 250px;
            padding: 25px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .topbar h1 {
            font-size: 28px;
        }

        .topbar p {
            color: #6b7280;
            margin-top: 5px;
        }

        .btn {
            border: none;
            padding: 11px 18px;
            border-radius: 7px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .filter-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-box input,
        .filter-box select {
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            min-width: 220px;
        }

        .table-container {
            background: white;
            border-radius: 10px;
            overflow-x: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th {
            background: #f9fafb;
            text-align: left;
            padding: 15px;
            font-size: 13px;
            color: #374151;
            border-bottom: 1px solid #e5e7eb;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
        }

        tr:hover {
            background: #f9fafb;
        }

        .status {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-use {
            background: #dcfce7;
            color: #166534;
        }

        .status-available {
            background: #dbeafe;
            color: #1e40af;
        }

        .status-repair {
            background: #fee2e2;
            color: #991b1b;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        @media (max-width: 800px) {
            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
            }

            .main {
                margin-left: 0;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .filter-box {
                flex-direction: column;
            }

            .filter-box input,
            .filter-box select {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="sidebar">

    <div class="company-logo">
        <img src="assets/logo.jpg" alt="Elsewedy Cables Logo">
    </div>

    <div class="system-title">
        IT Asset Manager
    </div>

    <div class="menu-title">Main Menu</div>

    <a href="index.html">📊 Dashboard</a>
    <a href="assets.html" class="active">💻 Assets</a>
    <a href="employees.html">👥 Employees</a>
    <a href="#">🔄 Assignments</a>
    <a href="#">🔧 Maintenance</a>
    <a href="#">📈 Reports</a>

    <div class="menu-title">System</div>

    <a href="#">⚙️ Settings</a>

</div>


<div class="main">

    <div class="topbar">

        <div>
            <h1>Assets</h1>
            <p>Manage company IT equipment and assets.</p>
        </div>

        <a href="add-asset.html" class="btn btn-primary">
            + Add New Asset
        </a>

    </div>


    <div class="filter-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search asset..."
            onkeyup="filterAssets()"
        >

        <select id="departmentFilter" onchange="filterAssets()">
            <option value="">All Departments</option>
            <option value="IT">IT</option>
            <option value="Finance">Finance</option>
            <option value="HR">HR</option>
            <option value="Production">Production</option>
            <option value="Purchasing">Purchasing</option>
            <option value="Quality">Quality</option>
            <option value="Management">Management</option>
        </select>

        <select id="statusFilter" onchange="filterAssets()">
            <option value="">All Status</option>
            <option value="In Use">In Use</option>
            <option value="Available">Available</option>
            <option value="Repair">Repair</option>
        </select>

    </div>


    <div class="table-container">

        <table>

            <thead>
                <tr>
                    <th>Asset ID</th>
                    <th>Equipment</th>
                    <th>Category</th>
                    <th>Serial Number</th>
                    <th>Department</th>
                    <th>Status</th>
                    <th>Location</th>
                </tr>
            </thead>

            <tbody id="assetTable"></tbody>

        </table>

    </div>

</div>


<script>

const sampleAssets = [

    {
        id: "PC-001",
        equipment: "Dell OptiPlex Desktop",
        category: "Computer",
        serial: "DELL-PC001",
        department: "Finance",
        status: "In Use",
        location: "Head Office"
    },

    {
        id: "LT-014",
        equipment: "Dell Latitude Laptop",
        category: "Laptop",
        serial: "DELL-LT014",
        department: "HR",
        status: "In Use",
        location: "Head Office"
    },

    {
        id: "PR-025",
        equipment: "HP Laser Printer",
        category: "Printer",
        serial: "HP-PR025",
        department: "IT",
        status: "Available",
        location: "IT Office"
    },

    {
        id: "SW-008",
        equipment: "Network Switch",
        category: "Network Equipment",
        serial: "SW-008",
        department: "IT",
        status: "In Use",
        location: "Server Room"
    },

    {
        id: "PC-034",
        equipment: "Desktop Computer",
        category: "Computer",
        serial: "PC-034",
        department: "Production",
        status: "Repair",
        location: "Factory"
    }

];


let savedAssets =
    JSON.parse(localStorage.getItem("assets")) || [];

let assets = [...sampleAssets, ...savedAssets];


function displayAssets(data) {

    const table = document.getElementById("assetTable");

    table.innerHTML = "";

    if (data.length === 0) {

        table.innerHTML = `
            <tr>
                <td colspan="7" class="empty">
                    No assets found.
                </td>
            </tr>
        `;

        return;
    }


    data.forEach(asset => {

        let statusClass = "status-use";

        if (asset.status === "Available") {
            statusClass = "status-available";
        }

        if (asset.status === "Repair") {
            statusClass = "status-repair";
        }


        table.innerHTML += `

            <tr>

                <td><strong>${asset.id}</strong></td>

                <td>${asset.equipment}</td>

                <td>${asset.category}</td>

                <td>${asset.serial}</td>

                <td>${asset.department}</td>

                <td>
                    <span class="status ${statusClass}">
                        ${asset.status}
                    </span>
                </td>

                <td>${asset.location}</td>

            </tr>

        `;

    });

}


function filterAssets() {

    const search =
        document.getElementById("searchInput")
        .value
        .toLowerCase();

    const department =
        document.getElementById("departmentFilter")
        .value;

    const status =
        document.getElementById("statusFilter")
        .value;


    const filtered = assets.filter(asset => {

        const matchesSearch =
            asset.id.toLowerCase().includes(search) ||
            asset.equipment.toLowerCase().includes(search) ||
            asset.serial.toLowerCase().includes(search);


        const matchesDepartment =
            department === "" ||
            asset.department === department;


        const matchesStatus =
            status === "" ||
            asset.status === status;


        return (
            matchesSearch &&
            matchesDepartment &&
            matchesStatus
        );

    });


    displayAssets(filtered);

}


displayAssets(assets);

</script>

</body>
</html>
